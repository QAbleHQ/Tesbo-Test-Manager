# Pre-merge checks. The same scripts the Jenkins pipelines run before a deploy, so a pull request is
# judged by exactly what would stop its merge from shipping:
#   scripts/ci-check.sh   typecheck, lint ratchet, unit tests, critical-dependency audit, repo hygiene
#   gitleaks              secrets in the committed tree and history (.gitleaks.toml, .gitleaksignore)
#
# To make these a real gate, require both jobs in the branch protection rule for main and dev
# (Settings > Branches). Until then they only report.
name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# A newer push to the same pull request makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here needs to write to the repository, and a workflow that cannot write cannot be
# turned into a way to.
permissions:
  contents: read

jobs:
  gates:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Third-party actions are pinned to a major tag; Dependabot (github-actions ecosystem) proposes bumps.
      # Pin to a full commit SHA if the repository's policy requires it.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Tesbo-Backend-Nest/package-lock.json
            Tesbo-Frontend/package-lock.json
      - run: bash scripts/ci-check.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # History is scanned too: a secret committed and later deleted is still a leaked secret.
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm --entrypoint sh -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.28.0 \
            -c 'git config --global --add safe.directory /repo && gitleaks detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner'
